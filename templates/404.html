{% extends "base.html" %}
{% block title %}Page Not Found | {{ site_meta.title }}{% endblock %}
{% block content %}
<div class="container">
  <div class="error-page">
    <p class="error-code">404</p>
    <h1>This page took a wrong turn</h1>
    <p>The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
    <a class="btn btn-primary" href="{{ url_for('index') }}">Back to Home</a>
  </div>
</div>
{% endblock %}
